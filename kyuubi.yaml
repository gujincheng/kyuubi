apiVersion: v1
kind: ConfigMap
metadata:
  name: kyuubi-conf
  namespace: spark
data:
  kyuubi-defaults.conf: |
    kyuubi.authentication=NONE
    kyuubi.frontend.bind.host=0.0.0.0
    kyuubi.frontend.protocols=THRIFT_BINARY,REST
    kyuubi.frontend.thrift.binary.bind.port=10009
    kyuubi.engine.type=SPARK_SQL
    kyuubi.engine.share.level=USER
    # 生产资源模型(见知识库手册第七章):默认档 engine pool=2 轮询,ETL 档走 subdomain 独立引擎
    kyuubi.engine.pool.size=2
    kyuubi.engine.pool.selectPolicy=POLLING
    kyuubi.session.engine.idle.timeout=PT30M
    kyuubi.session.engine.initialize.timeout=PT3M
    kyuubi.log.level=INFO
    kyuubi.digiwin.datasource.store.enabled=true
    kyuubi.digiwin.datasource.store.jdbc.url=jdbc:sqlite:/tmp/digiwin-datasources.db
    kyuubi.digiwin.datasource.store.jdbc.driver=org.sqlite.JDBC
    kyuubi.digiwin.datasource.credential.secret=0123456789abcdef
    kyuubi.session.conf.advisor=org.apache.kyuubi.digiwin.datasource.DatasourceConfAdvisor
    kyuubi.digiwin.sql.inspection.enabled=true
    kyuubi.backend.server.event.loggers=JSON
    kyuubi.backend.server.event.json.log.path=file:///tmp/kyuubi-server-events
  spark-defaults.conf: |
    spark.master                       k8s://https://kubernetes.default.svc:443
    spark.kubernetes.namespace         spark
    spark.kubernetes.container.image   spark-iceberg:3.5.8
    spark.kubernetes.container.image.pullPolicy     IfNotPresent
    spark.kubernetes.executor.podNamePrefix         kyuubi-exec
    spark.driver.bindAddress           0.0.0.0
    spark.executor.cores               2
    # quota 要求每个容器必须显式 limits.cpu;executor 默认只设 request 不设 limit,必须补
    spark.kubernetes.executor.limit.cores           2
    spark.executor.memory              2g
    spark.executor.memoryOverhead      1g
    spark.dynamicAllocation.enabled                 true
    spark.shuffle.service.enabled                   false
    spark.dynamicAllocation.shuffleTracking.enabled true
    spark.dynamicAllocation.minExecutors            0
    # 默认档(BI/即席):pool 内 2 个引擎共享此默认值,峰值 2×4×2c=16C;ETL 档经 URL ? 段覆盖
    spark.dynamicAllocation.maxExecutors            4
    spark.dynamicAllocation.executorIdleTimeout     60s
    spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID     aws-creds:AWS_ACCESS_KEY_ID
    spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY aws-creds:AWS_SECRET_ACCESS_KEY
    spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.spark_catalog                 org.apache.iceberg.spark.SparkSessionCatalog
    spark.sql.catalog.spark_catalog.type            hive
    spark.sql.warehouse.dir                         s3a://iceberg/
    spark.sql.catalogImplementation                 hive
    spark.hadoop.hive.execution.engine              spark
    spark.hadoop.fs.s3a.endpoint                    http://s3.seaweedfs.local:30080
    spark.hadoop.fs.s3a.path.style.access           true
    spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled      false
    spark.hadoop.fs.s3a.aws.credentials.provider    com.amazonaws.auth.EnvironmentVariableCredentialsProvider
  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://172.16.7.137:9083</value>
      </property>
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://iceberg/</value>
      </property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyuubi
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels: { app: kyuubi }
  template:
    metadata:
      labels: { app: kyuubi }
    spec:
      nodeSelector:
        kubernetes.io/hostname: ddp2    # 镜像只构建在 ddp2;分发到其他节点后可删掉
      serviceAccountName: spark-sa      # 复用现有 SA,driver 建 executor 权限已够
      containers:
        - name: kyuubi
          image: kyuubi:1.11.1-digiwin
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 10009 }
            - { containerPort: 10099 }
          envFrom:
            - secretRef: { name: aws-creds }
          resources:
            # driver 进程跑在本 Pod 内:默认档 2×2g + ETL 档 1×4g + server,约需 10g
            requests: { cpu: "2", memory: 6Gi }
            limits:   { cpu: "8", memory: 16Gi }
          volumeMounts:
            - { name: conf, mountPath: /opt/kyuubi/conf }
            - { name: spark-conf, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: spark-defaults.conf }
            - { name: spark-conf, mountPath: /opt/spark/conf/hive-site.xml, subPath: hive-site.xml }
      volumes:
        - name: conf
          configMap: { name: kyuubi-conf }
        - name: spark-conf
          configMap:
            name: kyuubi-conf
            items:
              - { key: spark-defaults.conf, path: spark-defaults.conf }
              - { key: hive-site.xml, path: hive-site.xml }
---
# 集群总量兜底:所有档位(默认 pool 16C + ETL 12C)峰值叠加也撞不破此上限
# 打满表现:executor Pod Pending(事件提示 exceeded quota)——这是背压信号,不是故障
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spark-quota
  namespace: spark
spec:
  hard:
    requests.cpu: "28"
    requests.memory: 60Gi
    limits.cpu: "40"
    limits.memory: 75Gi
---
# 与 quota 配套必需:quota 声明 limits/requests 后,未显式写 limits/requests 的 Pod 会被拒建。
# 此处为命名空间内所有"漏写"的容器补默认值(executor 已由 spark.kubernetes.executor.limit.cores 显式覆盖)
apiVersion: v1
kind: LimitRange
metadata:
  name: spark-default-limits
  namespace: spark
spec:
  limits:
    - type: Container
      default:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: 100m
        memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi
  namespace: spark
spec:
  type: NodePort
  selector: { app: kyuubi }
  ports:
    - { name: thrift, port: 10009, targetPort: 10009, nodePort: 30009 }
    - { name: rest,   port: 10099, targetPort: 10099, nodePort: 30099 }
