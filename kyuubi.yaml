apiVersion: v1
kind: ConfigMap
metadata:
  name: kyuubi-conf
  namespace: spark
data:
  kyuubi-defaults.conf: |
    kyuubi.authentication=NONE
    kyuubi.frontend.bind.host=0.0.0.0
    kyuubi.frontend.protocols=THRIFT_BINARY,REST
    kyuubi.frontend.thrift.binary.bind.port=10009
    kyuubi.engine.type=SPARK_SQL
    kyuubi.engine.share.level=USER
    # 生产资源模型(见知识库手册第七章):默认档 engine pool=2 轮询,ETL 档走 subdomain 独立引擎
    kyuubi.engine.pool.size=2
    kyuubi.engine.pool.selectPolicy=POLLING
    kyuubi.session.engine.idle.timeout=PT30M
    kyuubi.session.engine.initialize.timeout=PT3M
    kyuubi.log.level=INFO
    # Redact per-datasource object-storage credentials from engine launch logs and session views.
    kyuubi.server.redaction.regex=(?i)password|secret|token|credential|access\\.key
    kyuubi.digiwin.datasource.store.enabled=true
    kyuubi.digiwin.datasource.store.jdbc.url=jdbc:sqlite:/opt/kyuubi/data/digiwin-datasources.db
    kyuubi.digiwin.datasource.store.jdbc.driver=org.sqlite.JDBC
    # 固定的 16 字节数据源凭据加密主密钥；部署前替换为本环境专用值，后续不可随意修改。
    kyuubi.digiwin.datasource.credential.secret=0123456789abcdef
    kyuubi.session.conf.advisor=org.apache.kyuubi.digiwin.datasource.DatasourceConfAdvisor
    kyuubi.digiwin.sql.inspection.enabled=true
    kyuubi.backend.server.event.loggers=JSON
    kyuubi.backend.server.event.json.log.path=file:///opt/kyuubi/data/events
  spark-defaults.conf: |
    spark.master                       k8s://https://kubernetes.default.svc:443
    spark.kubernetes.namespace         spark
    spark.kubernetes.container.image   spark-iceberg:3.5.8
    spark.kubernetes.container.image.pullPolicy     IfNotPresent
    spark.kubernetes.executor.podNamePrefix         kyuubi-exec
    spark.driver.bindAddress           0.0.0.0
    spark.executor.cores               2
    # quota 要求每个容器必须显式 limits.cpu;executor 默认只设 request 不设 limit,必须补
    spark.kubernetes.executor.limit.cores           2
    spark.executor.memory              2g
    spark.executor.memoryOverhead      1g
    spark.dynamicAllocation.enabled                 true
    spark.shuffle.service.enabled                   false
    spark.dynamicAllocation.shuffleTracking.enabled true
    # shuffle 数据最多拖住 Executor 300s;默认 infinity,要等 Driver GC 释放引用才回收(可拖 10+ 分钟)
    spark.dynamicAllocation.shuffleTracking.timeout 300s
    spark.dynamicAllocation.minExecutors            0
    # 默认档(BI/即席):pool 内 2 个引擎共享此默认值,峰值 2×4×2c=16C;ETL 档经 URL ? 段覆盖
    spark.dynamicAllocation.maxExecutors            4
    spark.dynamicAllocation.executorIdleTimeout     60s
    # shuffle 本地盘:hostPath 落节点数据盘(/mnt/data1 按节点实际数据盘路径调整,改前先在所有节点预建目录并 chmod 777)
    # 注意:hostPath 不支持 sizeLimit,Pod 删除后数据残留在节点盘上,需定期清理
    spark.kubernetes.executor.volumes.hostPath.spark-local-dir-1.options.path  /opt/spark_shuffle_data
    spark.kubernetes.executor.volumes.hostPath.spark-local-dir-1.options.type  DirectoryOrCreate
    spark.kubernetes.executor.volumes.hostPath.spark-local-dir-1.mount.path    /data/shuffle
    # Catalog、HMS、Warehouse 和对象存储凭据均由数据源管理按标签动态注入
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyuubi
  namespace: spark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: kyuubi }
  template:
    metadata:
      labels: { app: kyuubi }
    spec:
      securityContext:
        fsGroup: 10009
      nodeSelector:
        kubernetes.io/hostname: ddp2
      serviceAccountName: spark-sa      # 复用现有 SA,driver 建 executor 权限已够
      initContainers:
        - name: initialize-kyuubi-state
          image: kyuubi:1.12.0-digiwin-datasources
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /state/conf /state/audit /state/events
              for source in /seed/*; do
                name=$(basename "$source")
                if [ ! -e "/state/conf/$name" ]; then
                  cp "$source" "/state/conf/$name"
                fi
              done
              chown -R 10009:0 /state
              chmod 750 /state /state/conf /state/audit /state/events
          volumeMounts:
            - { name: conf-seed, mountPath: /seed, readOnly: true }
            - { name: data, mountPath: /state }
      containers:
        - name: kyuubi
          image: kyuubi:1.12.0-digiwin-datasources
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 10009 }
            - { containerPort: 10099 }
          env:
            - { name: KYUUBI_CONF_DIR, value: /opt/kyuubi/conf }
            - { name: KYUUBI_IDENTITY_ACCESS_PATH, value: /opt/kyuubi/conf/kyuubi-identity-access.json }
            - { name: KYUUBI_ADMIN_PERMISSIONS_PATH, value: /opt/kyuubi/conf/kyuubi-admin-permissions.json }
            - { name: KYUUBI_AUDIT_LOG_PATH, value: /opt/kyuubi/data/audit/kyuubi-audit.jsonl }
          resources:
            # driver 进程跑在本 Pod 内:默认查询档预留 4C/8Gi,Executor 资源单独计算
            requests: { cpu: "2", memory: 6Gi }
            limits:   { cpu: "4", memory: 8Gi }
          volumeMounts:
            - { name: data, mountPath: /opt/kyuubi/data }
            - { name: data, mountPath: /opt/kyuubi/conf, subPath: conf }
            - { name: data, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: conf/spark-defaults.conf }
      volumes:
        - name: conf-seed
          configMap: { name: kyuubi-conf }
        - name: data
          hostPath:
            path: /opt/kyuubi-data
            type: DirectoryOrCreate
---
# 集群总量兜底:按三台 8C/24Gi 节点预留系统资源,默认档峰值不会超过此上限
# 打满表现:executor Pod Pending(事件提示 exceeded quota)——这是背压信号,不是故障
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spark-quota
  namespace: spark
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 54Gi
    limits.cpu: "24"
    limits.memory: 64Gi
---
# 与 quota 配套必需:quota 声明 limits/requests 后,未显式写 limits/requests 的 Pod 会被拒建。
# 此处为命名空间内所有"漏写"的容器补默认值(executor 已由 spark.kubernetes.executor.limit.cores 显式覆盖)
apiVersion: v1
kind: LimitRange
metadata:
  name: spark-default-limits
  namespace: spark
spec:
  limits:
    - type: Container
      default:
        cpu: "4"
        memory: 8Gi
      defaultRequest:
        cpu: 100m
        memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kyuubi
  namespace: spark
spec:
  type: NodePort
  selector: { app: kyuubi }
  ports:
    - { name: thrift, port: 10009, targetPort: 10009, nodePort: 30009 }
    - { name: rest,   port: 10099, targetPort: 10099, nodePort: 30099 }
